<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S.</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #0d1420;
    color: #8fd8ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  #dialWrap {
    width: 300px;
    height: 300px;
    margin-bottom: 10px;
  }
  #dashRing {
    transform-origin: 150px 150px;
    animation: spin-cw 30s linear infinite;
  }
  #cyanRing {
    transform-origin: 150px 150px;
    animation: spin-cw 16s linear infinite;
  }
  #orangeRing {
    transform-origin: 150px 150px;
    animation: spin-ccw 11s linear infinite;
  }
  @keyframes spin-cw {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spin-ccw {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  #core {
    transform-origin: 150px 150px;
    animation: breathe 3s ease-in-out infinite;
  }
  #core.active {
    animation: think 0.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.85; }
  }
  @keyframes think {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  #status {
    margin: 12px 0 20px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #4fc3f7;
    text-transform: uppercase;
  }
  #micBtn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #123246;
    border: 2px solid #4fc3f7;
    color: #4fc3f7;
    font-size: 24px;
    cursor: pointer;
    margin-bottom: 20px;
    transition: all 0.2s;
  }
  #micBtn:hover { background: #1a4a63; }
  #micBtn.listening {
    background: #c0392b;
    border-color: #ff6b5b;
    animation: pulse-mic 1s ease-in-out infinite;
  }
  @keyframes pulse-mic {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,91,0.5); }
    50% { box-shadow: 0 0 0 12px rgba(255,107,91,0); }
  }
  #transcript {
    width: 100%;
    max-width: 500px;
    flex: 1;
    overflow-y: auto;
    margin-bottom: 15px;
    max-height: 260px;
  }
  .line {
    margin: 8px 0;
    font-size: 14px;
    line-height: 1.4;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .line .who {
    color: #4fc3f7;
    font-weight: bold;
    margin-right: 8px;
  }
  .line.user .who { color: #8fd8ff; }
  .line.jarvis .who { color: #4fc3f7; }
  #inputArea {
    display: flex;
    width: 100%;
    max-width: 500px;
    gap: 10px;
  }
  #userInput {
    flex: 1;
    background: #10161f;
    border: 1px solid #1c3d52;
    color: #8fd8ff;
    padding: 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  #userInput:focus { outline: none; border-color: #4fc3f7; }
  #sendBtn {
    background: #123246;
    border: 1px solid #4fc3f7;
    color: #4fc3f7;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  #sendBtn:hover { background: #1a4a63; }
</style>
</head>
<body>

<div id="dialWrap">
<svg viewBox="0 0 300 300" width="300" height="300">
  <circle cx="150" cy="150" r="140" fill="none" stroke="#1e3a52" stroke-width="1"/>
  <g id="ticks" stroke="#3a6580" stroke-width="2">
    <g id="tickLines"></g>
  </g>
  <circle id="dashRing" cx="150" cy="150" r="118" fill="none" stroke="#25455e" stroke-width="1" stroke-dasharray="2 6"/>
  <g id="cyanRing" fill="none" stroke="#29c1f0" stroke-width="15" stroke-linecap="round">
    <path d="M 150.5 61 A 89 89 0 0 1 208 84.5" />
    <path d="M 216 92.5 A 89 89 0 0 1 239 150" />
    <path d="M 239 158 A 89 89 0 0 1 216 216" />
    <path d="M 208 224 A 89 89 0 0 1 150.5 239" />
    <path d="M 149.5 239 A 89 89 0 0 1 92 216" />
    <path d="M 84 208 A 89 89 0 0 1 61 150" />
  </g>
  <g id="orangeRing" fill="none" stroke="#c07a2e" stroke-width="3.5" stroke-linecap="round">
    <path d="M 232.6 108 A 100 100 0 0 1 245.5 150" />
    <path d="M 54.5 150 A 100 100 0 0 1 67.4 108" />
  </g>
  <circle id="core" cx="150" cy="150" r="70" fill="#132f45"/>
</svg>
</div>
<div id="status">Online</div>
<button id="micBtn" title="Click to talk">&#127908;</button>

<div id="transcript"></div>

<div id="inputArea">
  <input type="text" id="userInput" placeholder="Talk to Jarvis..." autocomplete="off" />
  <button id="sendBtn">Send</button>
</div>

<script>
const tickLines = document.getElementById("tickLines");
for (let i = 0; i < 40; i++) {
  const angle = (i / 40) * 2 * Math.PI;
  const r1 = 128, r2 = i % 5 === 0 ? 116 : 122;
  const x1 = 150 + r1 * Math.cos(angle);
  const y1 = 150 + r1 * Math.sin(angle);
  const x2 = 150 + r2 * Math.cos(angle);
  const y2 = 150 + r2 * Math.sin(angle);
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1);
  line.setAttribute("y1", y1);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);
  tickLines.appendChild(line);
}

const transcript = document.getElementById("transcript");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const status = document.getElementById("status");
const core = document.getElementById("core");
const micBtn = document.getElementById("micBtn");

function addLine(text, who) {
  const div = document.createElement("div");
  div.className = "line " + who;
  const label = document.createElement("span");
  label.className = "who";
  label.textContent = who === "user" ? "YOU:" : "JARVIS:";
  div.appendChild(label);
  div.appendChild(document.createTextNode(text));
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}

async function sendMessage(text) {
  const message = (text !== undefined ? text : input.value).trim();
  if (!message) return;

  addLine(message, "user");
  input.value = "";
  status.textContent = "Processing";
  core.classList.add("active");

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });
    const data = await response.json();
    addLine(data.reply, "jarvis");
    speak(data.reply);
  } catch (err) {
    addLine("Connection error. Please try again.", "jarvis");
  }

  status.textContent = "Online";
  core.classList.remove("active");
}

sendBtn.addEventListener("click", () => sendMessage());
input.addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendMessage();
});

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-US";

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add("listening");
    status.textContent = "Listening";
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove("listening");
    status.textContent = "Online";
  };

  recognition.onerror = () => {
    listening = false;
    micBtn.classList.remove("listening");
    status.textContent = "Online";
  };

  recognition.onresult = (event) => {
    const heard = event.results[0][0].transcript;
    sendMessage(heard);
  };

  micBtn.addEventListener("click", () => {
    if (listening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });
} else {
  micBtn.addEventListener("click", () => {
    addLine("Voice recognition isn't supported in this browser. Please use Chrome.", "jarvis");
  });
}
</script>

</body>
</html>
